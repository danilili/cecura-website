<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Constelación familiar con núcleo central y nodos conectados">
  <defs>
    <linearGradient id="fa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE8F4"/>
      <stop offset="100%" stop-color="#AFA0C8"/>
    </linearGradient>
    <radialGradient id="fa-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fa-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#72195A"/>
      <stop offset="100%" stop-color="#3563A9"/>
    </radialGradient>
    <pattern id="fa-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.55" fill="#72195A" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#fa-bg)"/>
  <rect width="800" height="600" fill="url(#fa-dots)"/>
  <rect width="800" height="600" fill="url(#fa-glow)"/>

  <!-- Líneas de conexión -->
  <g stroke="#72195A" stroke-opacity="0.40" stroke-width="1.1" stroke-dasharray="3,5">
    <line x1="400" y1="300" x2="190" y2="170"/>
    <line x1="400" y1="300" x2="640" y2="180"/>
    <line x1="400" y1="300" x2="200" y2="450"/>
    <line x1="400" y1="300" x2="620" y2="450"/>
    <line x1="400" y1="300" x2="400" y2="120"/>
    <line x1="400" y1="300" x2="400" y2="500"/>
  </g>

  <!-- Halo del núcleo -->
  <circle cx="400" cy="300" r="86" fill="none" stroke="#72195A" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- Nodos satélite (miembros de la familia) -->
  <g>
    <circle cx="190" cy="170" r="22" fill="#72195A" fill-opacity="0.60"/>
    <circle cx="640" cy="180" r="18" fill="#72195A" fill-opacity="0.55"/>
    <circle cx="200" cy="450" r="20" fill="#72195A" fill-opacity="0.50"/>
    <circle cx="620" cy="450" r="24" fill="#72195A" fill-opacity="0.62"/>
    <circle cx="400" cy="120" r="16" fill="#72195A" fill-opacity="0.45"/>
    <circle cx="400" cy="500" r="20" fill="#72195A" fill-opacity="0.55"/>
  </g>

  <!-- Núcleo (la familia que se sostiene) -->
  <circle cx="400" cy="300" r="52" fill="url(#fa-core)"/>
  <circle cx="400" cy="300" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
