<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Arcos concéntricos emergiendo, símbolo de formación">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE8F4"/>
      <stop offset="100%" stop-color="#AFA0C8"/>
    </linearGradient>
    <pattern id="f-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A4F88" stroke-opacity="0.08" stroke-width="0.8"/>
    </pattern>
    <radialGradient id="f-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#72195A"/>
      <stop offset="100%" stop-color="#3563A9"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#f-bg)"/>
  <rect width="800" height="600" fill="url(#f-grid)"/>

  <!-- Arcos concéntricos desde la esquina inferior izquierda -->
  <g fill="none" stroke="#2A4F88" stroke-width="1.6">
    <circle cx="140" cy="540" r="110" stroke-opacity="0.55"/>
    <circle cx="140" cy="540" r="190" stroke-opacity="0.45"/>
    <circle cx="140" cy="540" r="280" stroke-opacity="0.36"/>
    <circle cx="140" cy="540" r="380" stroke-opacity="0.28"/>
    <circle cx="140" cy="540" r="490" stroke-opacity="0.20"/>
    <circle cx="140" cy="540" r="610" stroke-opacity="0.13"/>
    <circle cx="140" cy="540" r="740" stroke-opacity="0.08"/>
  </g>

  <!-- Disco central (el origen / facilitador) -->
  <circle cx="140" cy="540" r="50" fill="url(#f-sun)"/>
  <circle cx="140" cy="540" r="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Tres puntos satélite sobre los arcos: aprendices -->
  <g fill="#72195A">
    <circle cx="480" cy="380" r="6" fill-opacity="0.7"/>
    <circle cx="660" cy="220" r="5" fill-opacity="0.6"/>
    <circle cx="310" cy="180" r="6" fill-opacity="0.65"/>
  </g>
</svg>
